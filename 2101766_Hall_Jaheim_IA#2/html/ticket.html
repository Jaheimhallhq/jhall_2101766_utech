<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Ticket Coding Conf 2026</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="ticket-page">

    <main id="ticket-content" hidden>
        <div class="brand">
            <img src="../assests/logo.png" alt="" width="34" height="28">
            <span>Coding Conf</span>
        </div>

        <h1>Congrats, <span class="accent" id="congrats-name"></span>!<br>Your ticket is ready.</h1>

        <p class="lead">
            We've saved your ticket for <span class="email" id="congrats-email"></span>
            and will see you at the event on October 26, 2026.
        </p>

        <section class="ticket" aria-label="Conference ticket">
                <div class="ticket-body">
                <div class="ticket-main">
                <div class="ticket-brand">
                        <img src="../assests/logo.png" alt="Coding Conf logo" width="44" height="36">
                        <h2 id="ticket-event">Coding Conf</h2>
                </div>
                    <p class="ticket-meta">Oct 26, 2026 <span class="slash">/</span> Papine, Kgn</p>

                    <div class="attendee">
                        <img id="ticket-avatar" width="66" height="66" alt="Avatar">
                    <div>
                            <p class="attendee-name" id="ticket-name"></p>
                            <a id="ticket-github" class="github" href="https://github.com/" target="_blank" rel="noopener noreferrer">
                                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                                <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                                </svg>
                                <span id="ticket-github-handle"></span>
                            </a>
                    </div>
                    </div>
                    </div>

                    <div class="ticket-stub">
                    <span class="serial" id="ticket-serial"></span>
                    </div>
                </div>
        </section>

                <div class="actions">
            <button id="print-button" type="button">Print ticket</button>
            <a href="login.html">Register again</a>
             </div>
    </main>

    <noscript>
        <p class="noscript">Your ticket needs JavaScript to load. Please enable JavaScript and reload this page.</p>
    </noscript>

    <script src="../js/validation.js"></script>
    <script src="../js/ticket.js"></script>
</body>
</html>
